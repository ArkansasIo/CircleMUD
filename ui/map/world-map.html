<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircleMUD World Map</title>
<style>
:root{color-scheme:dark;--bg:#080d12;--panel:#101820;--line:#2b3b4b;--text:#d9e2ea;--muted:#8093a5;--accent:#55b6e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui;height:100vh;overflow:hidden}.app{display:grid;grid-template-rows:46px 1fr;height:100vh}.top{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:#0d141c}.title{font-weight:700}.crumb{margin-left:22px;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px}.actions button,.tools button{background:#17232e;color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:3px}.layout{display:grid;grid-template-columns:240px 1fr 270px;min-height:0}.left,.right{background:var(--panel);padding:12px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.layer{display:block;width:100%;text-align:left;padding:8px;border:0;background:transparent;color:var(--text)}.layer:hover{background:#192733}.map{position:relative;overflow:hidden;background:#111b20;cursor:grab}.map:active{cursor:grabbing}.world{position:absolute;width:1200px;height:800px;transform-origin:0 0;background-color:#1b2826;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}.region{position:absolute;border:1px solid #ffffff28;border-radius:12px;opacity:.9}.region span{position:absolute;top:10px;left:12px;font-weight:700;text-shadow:0 1px 3px #000}.road{position:absolute;height:4px;background:#bda56d88;transform-origin:left center;border-radius:4px}.loc{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;border:2px solid #e6edf3;background:#182530;cursor:pointer;box-shadow:0 0 0 4px #0005}.loc.capital{background:#e6c15a}.loc.dungeon{background:#c75b61}.loc.village{background:#76a86f}.player{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #55b6e844,0 0 18px #55b6e8}.coords{position:absolute;bottom:10px;left:10px;background:#080d12cc;padding:6px;color:var(--muted)}.legend{display:grid;gap:8px}.legend div{display:flex;gap:8px;align-items:center}.dot{width:11px;height:11px;border-radius:50%}.mini{height:150px;border:1px solid var(--line);background:#17221f;position:relative;margin-bottom:15px}.mini-player{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);left:35%;top:45%}.status{color:var(--muted);line-height:1.6}
</style></head>
<body><div class="app"><header class="top"><div class="title">WORLD MAP</div><div class="crumb">The Broken Circle / World</div><div class="actions"><button onclick="zoom(1.2)">+</button><button onclick="zoom(.83)">−</button><button onclick="resetMap()">Reset</button></div></header><main class="layout"><aside class="left"><h3>Map Layers</h3><button class="layer">☑ Regions</button><button class="layer">☑ Roads</button><button class="layer">☑ Settlements</button><button class="layer">☑ Dungeons</button><button class="layer">☑ Player</button><h3>Navigation</h3><button class="layer" onclick="focusLocation(420,350)">Circlehold</button><button class="layer" onclick="focusLocation(1110,290)">Black Forge</button><button class="layer" onclick="focusLocation(760,930)">Ravenwatch</button><button class="layer" onclick="focusLocation(1540,820)">Drowned Archive</button></aside><section class="map" id="map"><div class="world" id="world"><div class="region" style="left:160px;top:180px;width:620px;height:420px;background:#274936"><span>Greenfall</span></div><div class="region" style="left:860px;top:120px;width:520px;height:360px;background:#51342f"><span>Ashen Reach</span></div><div class="region" style="left:420px;top:760px;width:680px;height:430px;background:#665d32"><span>Crown Plains</span></div><div class="region" style="left:1260px;top:620px;width:620px;height:420px;background:#304b45"><span>Drowned Archive</span></div><div class="road" style="left:420px;top:350px;width:680px;transform:rotate(56deg)"></div><div class="road" style="left:760px;top:930px;width:790px;transform:rotate(-8deg)"></div><div class="road" style="left:420px;top:350px;width:1240px;transform:rotate(21deg)"></div><div class="loc capital" style="left:420px;top:350px" title="Circlehold" onclick="selectLoc('Circlehold','Capital')"></div><div class="loc dungeon" style="left:1110px;top:290px" title="Black Forge" onclick="selectLoc('Black Forge','Dungeon')"></div><div class="loc village" style="left:760px;top:930px" title="Ravenwatch" onclick="selectLoc('Ravenwatch','Village')"></div><div class="loc dungeon" style="left:1540px;top:820px" title="Drowned Archive" onclick="selectLoc('Drowned Archive','Dungeon')"></div><div class="player" id="player" style="left:420px;top:350px"></div></div><div class="coords" id="coords">Map coordinates: 420, 350 · Zone: Circlehold</div></section><aside class="right"><h3>Minimap</h3><div class="mini"><div class="mini-player"></div></div><h3>Location</h3><div class="status" id="location">Circlehold<br>Capital city<br>Greenfall region</div><h3>Legend</h3><div class="legend"><div><i class="dot" style="background:#e6c15a"></i>Capital</div><div><i class="dot" style="background:#c75b61"></i>Dungeon</div><div><i class="dot" style="background:#76a86f"></i>Village</div><div><i class="dot" style="background:#55b6e8"></i>Player</div></div></aside></main></div>
<script>const world=document.getElementById('world');let scale=1,ox=0,oy=0,drag=false,sx=0,sy=0;function render(){world.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}function zoom(z){scale=Math.max(.45,Math.min(2.4,scale*z));render()}function resetMap(){scale=1;ox=0;oy=0;render()}function focusLocation(x,y){ox=innerWidth/2-x*scale;oy=(innerHeight-46)/2-y*scale;render()}function selectLoc(name,type){document.getElementById('location').innerHTML=`${name}<br>${type}<br>Selected on world map`}document.getElementById('map').addEventListener('pointerdown',e=>{drag=true;sx=e.clientX-ox;sy=e.clientY-oy});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){ox=e.clientX-sx;oy=e.clientY-sy;render()}});document.getElementById('map').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9)},{passive:false});render();</script></body></html>
